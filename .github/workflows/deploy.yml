name: Deploy Hostinger (FTP)

# Publica o site na Hostinger a cada push na branch main.
# Site estatico: nao ha build, apenas envio dos arquivos por FTP.
#
# Secrets necessarios (Settings > Secrets and variables > Actions):
#   FTP_HOST      -> 62.72.62.179
#   FTP_USERNAME  -> u299917777.elisasouza (aponta direto para o public_html do dominio proprio)
#   FTP_PASSWORD  -> senha dessa conta FTP
#
# A conta FTP dedicada aponta para a raiz do dominio nutrielisasouza.com.br, entao server-dir e "./".

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Enviar para a Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps        # FTP com TLS. Se falhar o handshake, troque para: ftp
          security: loose
          # A conta FTP dedicada ja aponta para o public_html do dominio proprio.
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README*.md
            **/*.md
